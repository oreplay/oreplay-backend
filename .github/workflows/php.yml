name: PHP Composer & SonarCloud

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.3' ]
        db-type: [ mysql ]
    services:
      memcached:
        image: memcached
        ports:
          - 11211/tcp

    steps:
      - name: Setup MySQL
        if: matrix.db-type == 'mysql'
        run: docker run --rm --name=mysqld -e MYSQL_ROOT_PASSWORD=password -e MYSQL_DATABASE=phputesting -p 3306:3306 -d mysql:8.0.28-debian --default-authentication-plugin=mysql_native_password --disable-log-bin

      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl-72.1, apcu, memcached, pdo_${{ matrix.db-type }}
          ini-values: apc.enable_cli = 1, zend.assertions = 1
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Get date part for cache key
        id: key-date
        run: echo "date=$(date +'%Y-%m')" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ steps.key-date.outputs.date }}-${{ hashFiles('composer.json') }}-${{ matrix.prefer-lowest }}

      - name: Composer install
        run: composer install -d app_rest

      - name: Wait for MySQL
        if: matrix.db-type == 'mysql' || matrix.db-type == 'mariadb'
        run: while ! `mysqladmin ping -h 127.0.0.1 --silent`; do printf 'Waiting for MySQL...\n'; sleep 2; done;

      - name: Check production code does not reference dev-only namespaces
        run: |
          if grep -rEn '(App|Results|Rankings|RadioRelay|RestOauth)\\Test\\|PHPUnit\\|Cake\\TestSuite' \
              app_rest/src app_rest/config app_rest/webroot \
              app_rest/plugins/*/src app_rest/plugins/*/config; then
            echo "::error::Production code references an autoload-dev namespace; it will not exist in a --no-dev build."
            exit 1
          fi

      - name: Run PHP code sniffer
        run: composer run-script cs-check -d app_rest

      - name: Run PHPUnit tests with coverage
        env:
          CACHE_DEFAULT_URL: ${{ format('memcached://127.0.0.1:{0}', job.services.memcached.ports['11211']) }}
          DATABASE_TEST_URL: 'mysql://root:password@127.0.0.1:3306/phputesting'
          COOKIE_ENCRYPT_CONFIG: 'restCookie:4524945321164895:6483546516543558'
        run: |
          composer run-script test-coverage -d app_rest

      - name: Analyze with SonarCloud without including coverage
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ github.workspace }}
          args: |
            -Dsonar.projectKey=oreplay_oreplay-backend
            -Dsonar.organization=o-replay
            -Dsonar.sources=app_rest/src,app_rest/plugins/Results/src
            -Dsonar.tests=app_rest/tests/TestCase,app_rest/plugins/Results/tests/TestCase
            -Dsonar.php.codesniffer.argument=--standard=phpcs.xml
            -Dsonar.php.coverage.reportPaths=app_rest/coverage.xml
            -Dsonar.coverage.exclusions=**/*

  docker-build-push:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, json
          tools: composer

      - name: Composer install
        run: composer install -d app_rest --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Boot the app under the production autoloader
        run: |
          for debug in 0 1; do
            echo "--- DEBUG=$debug ---"
            DEBUG=$debug php -r 'require "app_rest/vendor/autoload.php";
              (new App\Application("app_rest/config"))->bootstrap();
              echo "bootstrap OK\n";' || exit 1
          done

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Write version from tag into the app
        run: sed -i -E "s/return '[0-9]+\.[0-9]+\.[0-9]+';/return '${VERSION}';/" app_rest/src/Controller/SwaggerJsonController.php

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t oreplay/backend:${VERSION} -f docker/Dockerfile .
          docker push oreplay/backend:${VERSION}
