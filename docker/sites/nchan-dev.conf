# The nchan configuration that has to sit at http level, plus the publisher endpoint. Subscribers live in
# nginx-site-dev.conf instead, because they must answer on the port the ingress routes to.
#
# Sized deliberately: the zone defaults to 128 MB, which inside a 200 MB container would leave almost nothing
# for php-fpm. It is mapped into every worker, so summed worker RSS overstates it — measure the container.
nchan_shared_memory_size 8M;

# permessage-deflate is negotiated per websocket client, so a subscriber that cannot do it still works.
# The window defaults to 10, a 1 kB dictionary, which costs a third of the compression on a class payload.
nchan_permessage_deflate_compression_window 15;
nchan_permessage_deflate_compression_level 6;

# Where php publishes, on a port the Kubernetes service does not expose, so nothing outside the pod can
# reach it: a client able to publish here could forge results for every viewer of a class.
server {
    listen 8080;
    server_name _;
    charset utf-8;

    location ~ ^/internal/publish/(?<channel>.+)$ {
        nchan_publisher;
        # store a deflated copy beside the original, for websocket clients that negotiated the extension
        nchan_deflate_message_for_websocket on;
        nchan_channel_id $channel;
        # A client subscribes only after the POST it is following returns, by which time the first classes
        # are already published; the buffer is what stops those events being lost.
        nchan_message_buffer_length 10;
        nchan_message_timeout 1h;
        allow 127.0.0.1;
        deny all;
    }
}
