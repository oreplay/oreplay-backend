server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name _;
    include snippets/self-signed.conf;
    include snippets/ssl-params.conf;
    set $real_scheme "https";
    charset utf-8;
    root /var/www/cplatform/public/app_rest/webroot;
    rewrite_log on;
    index index.php;
    client_max_body_size 300M;
    ## Images and static content is treated different
        location ~* ^.(jpg|jpeg|gif|css|png|js|ico|xml|pdf|json)$ {
                access_log      off;
                expires         7d;
                add_header      Pragma public;
                add_header      Cache-Control "public, must-revalidate, proxy-revalidate";
        }
        ## Live channels, served by nchan rather than php-fpm, where every open connection would hold a
        ## worker for its whole life and a few dozen viewers would starve the pool.
        ## Under /api/v1/ because that is what the ingress routes to this service, and outside /api/v1/events/
        ## because that path is the CakePHP resource space, where "events" means an orienteering event.
        ## Requires libnginx-mod-nchan: see docker/Dockerfile and sites/nchan-dev.conf.
        location ~ ^/api/v1/live/uploads/(?<upload_id>[^/]+)$ {
                nchan_subscriber;
                nchan_channel_id "upload/$upload_id";
                # The subscriber arrives after the upload has begun, so it has to be given what it missed.
                nchan_subscriber_first_message oldest;
        }
        location ~ ^/api/v1/live/stages/(?<stage_id>[^/]+)/classes/(?<class_id>[^/]+)$ {
                nchan_subscriber;
                nchan_channel_id "stage/$stage_id/class/$class_id";
                # nothing is sent between results, and the ingress cuts a silent connection at 2700 s
                nchan_websocket_ping_interval 60;
                nchan_eventsource_ping_interval 60;
                # A viewer joining late wants the next result, not a replay of the whole upload.
                nchan_subscriber_first_message newest;
        }
        #rewrite rules for cakephp
        location / {
                try_files $uri $uri/ /index.php?$uri&$args;
        }
        # PHP scripts will be forwarded to fastcgi processess.
        location ~ \.php$ {
                try_files $uri =404;
                fastcgi_buffer_size 128k;
                fastcgi_buffers 64 32k;
                fastcgi_busy_buffers_size 128k;
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                include /etc/nginx/fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_read_timeout 300;
                fastcgi_send_timeout 300;
                fastcgi_connect_timeout 300;
                fastcgi_intercept_errors off;
                fastcgi_param  HTTPS 'on';
                fastcgi_pass   127.0.0.1:9000;
                fastcgi_index  index.php;
        }
}

